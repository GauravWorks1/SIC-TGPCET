<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spot Micro — a student-built quadruped robot by the Student Innovation Council, TGPCET. 12 high-torque servos, PCA9685, Raspberry Pi 4B and MPU6050. It stands, sits, walks and self-balances." />
    <meta name="theme-color" content="#050505" />
    <title>Spot Micro — Quadruped Robot | SIC TGPCET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-BSGu-DOd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-4zxsXoId.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- SIC back navigation (overlays the React app) -->
    <a href="../index.html#projects" id="sic-back" style="position:fixed;top:14px;left:14px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(5,5,5,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(200,255,0,.45);border-radius:999px;color:#c8ff00;font-family:'Inter',system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-decoration:none;transition:background .25s,transform .25s" onmouseover="this.style.background='rgba(200,255,0,.15)';this.style.transform='translateX(-3px)'" onmouseout="this.style.background='rgba(5,5,5,.72)';this.style.transform='none'">← BACK TO SIC</a>

    <style>
      /* Floating Corner Dual Live Videos for SpotMicro - Continuous Loop */
      .spot-video-widget {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: clamp(340px, 24vw, 420px);
        z-index: 9999;
        background: rgba(8, 10, 16, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(200, 255, 0, 0.45);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(200, 255, 0, 0.25);
        overflow: hidden;
        transition: box-shadow 0.3s ease, border-color 0.3s ease;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .spot-video-widget.minimized .spot-video-inner {
        display: none;
      }
      .spot-video-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: rgba(14, 18, 26, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .spot-video-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #c8ff00;
        font-family: monospace;
      }
      .live-pulse-lime {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c8ff00;
        box-shadow: 0 0 10px #c8ff00;
        animation: pulseLime 1.6s infinite ease-in-out;
      }
      @keyframes pulseLime {
        0%, 100% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px #c8ff00; }
      }
      .spot-video-tabs {
        display: flex;
        gap: 4px;
      }
      .spot-video-tab {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.75);
        border-radius: 4px;
        font-size: 10px;
        padding: 3px 8px;
        cursor: pointer;
        font-family: monospace;
        font-weight: 700;
        transition: all 0.2s ease;
      }
      .spot-video-tab:hover {
        background: rgba(200, 255, 0, 0.2);
        color: #fff;
      }
      .spot-video-tab.active {
        background: rgba(200, 255, 0, 0.25);
        border-color: #c8ff00;
        color: #c8ff00;
      }
      .spot-video-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .spot-video-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: rgba(255, 255, 255, 0.8);
        border-radius: 6px;
        font-size: 10px;
        padding: 4px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: monospace;
        font-weight: 600;
      }
      .spot-video-btn:hover {
        background: rgba(200, 255, 0, 0.25);
        border-color: #c8ff00;
        color: #fff;
      }
      .spot-video-inner {
        position: relative;
        width: 100%;
        background: #000;
        aspect-ratio: 16 / 9;
        max-height: 440px;
        overflow: hidden;
      }
      .spot-video-inner video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .spot-video-inner video.active {
        display: block;
      }
      .spot-video-overlay {
        position: absolute;
        bottom: 10px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }
      .spot-video-badge {
        font-size: 10px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(5, 8, 14, 0.85);
        backdrop-filter: blur(8px);
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-family: monospace;
      }
    </style>

    <!-- Floating Corner Dual Live Videos on Loop -->
    <div class="spot-video-widget" id="spotVideoWidget">
      <div class="spot-video-header">
        <div class="spot-video-status">
          <span class="live-pulse-lime"></span>
          <span>LIVE QUADRUPED</span>
        </div>
        <div class="spot-video-tabs">
          <button class="spot-video-tab active" id="tabSpot1" onclick="switchSpotVideo(1)">CAM 1</button>
          <button class="spot-video-tab" id="tabSpot2" onclick="switchSpotVideo(2)">CAM 2</button>
        </div>
        <div class="spot-video-actions">
          <button class="spot-video-btn" id="btnMuteSpot" onclick="toggleSpotMute()">UNMUTE</button>
          <button class="spot-video-btn" onclick="toggleSpotMinimize()">_</button>
        </div>
      </div>
      <div class="spot-video-inner">
        <!-- Video 1: Kinematics & Gait Routine -->
        <video id="spotVideo1" class="active" autoplay loop muted playsinline preload="auto">
          <source src="../assets/spotmicro_live_1.mp4" type="video/mp4" />
          <source src="assets/spotmicro_live_1.mp4" type="video/mp4" />
        </video>

        <!-- Video 2: Stand & Balance Test -->
        <video id="spotVideo2" loop muted playsinline preload="auto">
          <source src="../assets/spotmicro_live_2.mp4" type="video/mp4" />
          <source src="assets/spotmicro_live_2.mp4" type="video/mp4" />
        </video>

        <div class="spot-video-overlay">
          <span class="spot-video-badge" id="spotVideoBadge">GAIT ROUTINE 01 &bull; TGPCET IDEA LAB</span>
        </div>
      </div>
    </div>

    <script>
      let currentSpotVid = 1;
      function switchSpotVideo(num) {
        currentSpotVid = num;
        const v1 = document.getElementById('spotVideo1');
        const v2 = document.getElementById('spotVideo2');
        const tab1 = document.getElementById('tabSpot1');
        const tab2 = document.getElementById('tabSpot2');
        const badge = document.getElementById('spotVideoBadge');

        const videos = [v1, v2];
        const tabs = [tab1, tab2];

        videos.forEach((v, idx) => {
          if (!v) return;
          if (idx === num - 1) {
            v.classList.add('active');
            v.play().catch(() => {});
          } else {
            v.pause();
            v.classList.remove('active');
          }
        });

        tabs.forEach((t, idx) => {
          if (!t) return;
          t.classList.toggle('active', idx === num - 1);
        });

        if (badge) {
          badge.innerText = num === 1 
            ? 'GAIT ROUTINE 01 • TGPCET IDEA LAB' 
            : 'BALANCE TEST 02 • TGPCET IDEA LAB';
        }
      }

      function toggleSpotMute() {
        const v1 = document.getElementById('spotVideo1');
        const v2 = document.getElementById('spotVideo2');
        const btn = document.getElementById('btnMuteSpot');
        const activeVid = currentSpotVid === 1 ? v1 : v2;
        if (activeVid) {
          activeVid.muted = !activeVid.muted;
          if (btn) btn.innerText = activeVid.muted ? 'UNMUTE' : 'MUTE';
        }
      }

      function toggleSpotMinimize() {
        const w = document.getElementById('spotVideoWidget');
        if (w) {
          w.classList.toggle('minimized');
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        const v1 = document.getElementById('spotVideo1');
        if (v1) v1.play().catch(() => {});
      });
    </script>
  </body>
</html>
