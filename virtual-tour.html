<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TGPCET Innovation Hub — Virtual Tour</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #080b12;
    --panel: rgba(16, 21, 34, 0.85);
    --line: rgba(255, 255, 255, 0.12);
    --fg: #eef2ff;
    --mut: #9aa5c4;
    --acc: #6f8bff;
    --display: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
    --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 20% 10%, #131a2e 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 18px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    font: 700 18px/1.2 var(--display);
    letter-spacing: 0.01em;
  }
  .brand span {
    display: block;
    font: 400 11px var(--body);
    color: var(--mut);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 600 13px var(--body);
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 14px;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.18s ease, border-color 0.18s ease;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.25);
  }
  .player-shell {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
  }
  .chapters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .chap-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chap-btn {
    font: 600 13px var(--body);
    color: var(--mut);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 13px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .chap-btn:hover {
    color: var(--fg);
    background: rgba(255, 255, 255, 0.11);
  }
  .chap-btn.active {
    background: var(--acc);
    border-color: var(--acc);
    color: #080b12;
  }
  .note {
    font-size: 12px;
    color: var(--mut);
  }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        TGPCET Innovation Hub
        <span>AR/VR · Drone · Robotics — Virtual Tour</span>
      </div>
      <div class="actions">
        <a class="btn" href="index.html">← Back to Home</a>
      </div>
    </header>

    <div class="player-shell">
      <video id="tourVideo" controls playsinline preload="metadata" autoplay>
        <source src="virtual-tour.mp4" type="video/mp4">
        Your browser does not support HTML5 video. <a href="virtual-tour.mp4">Download the tour video</a>.
      </video>
    </div>

    <div class="chapters">
      <div class="chap-btns" role="group" aria-label="Jump to lab">
        <button class="chap-btn active" data-time="0">1. AR / VR Lab (0:00)</button>
        <button class="chap-btn" data-time="52">2. Drone Lab (0:52)</button>
        <button class="chap-btn" data-time="90.5">3. Robotics Lab (1:30)</button>
      </div>
      <span class="note">720p HD · Voiceover included</span>
    </div>
  </main>

  <script>
    (function () {
      var video = document.getElementById('tourVideo');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.chap-btn'));

      function setActive(t) {
        var activeIdx = 0;
        if (t >= 90.5) activeIdx = 2;
        else if (t >= 52) activeIdx = 1;
        buttons.forEach(function (b, i) {
          b.classList.toggle('active', i === activeIdx);
        });
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var target = parseFloat(btn.getAttribute('data-time')) || 0;
          video.currentTime = target;
          setActive(target);
          video.play().catch(function () {});
        });
      });

      video.addEventListener('timeupdate', function () {
        setActive(video.currentTime);
      });
    })();
  </script>
</body>
</html>
